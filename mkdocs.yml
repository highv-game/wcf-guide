site_name: 하파의 WoW 포에버 공략
site_description: WoW 클래식 포에버(World of Warcraft Forever) 직업·레벨링·전문기술 공략 모음
site_url: https://highv-game.github.io/wcf-guide/
repo_url: https://github.com/highv-game/wcf-guide
edit_uri: edit/main/docs/
copyright: 하파의 WoW 포에버 공략 · 베타 정보 기준이라 정식 출시 후 달라질 수 있습니다

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: 다크 모드
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드
  font: false
  icon:
    logo: material/sword-cross
    admonition:
      abstract: material/eye-outline
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.tracking
    - navigation.path

extra_css:
  - https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copy.js
  - javascripts/map-embed.js

plugins:
  - search:
      lang: [ko, en]
      separator: '[\s\-,:!=\[\]()"/]+'

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - 홈: index.md
  - 직업:
      - classes/index.md
      - 드루이드:
          - 야성 · 타우렌 (호드): classes/druid-tauren.md
          - 야성 · 스카이본 (얼라이언스): classes/druid.md
          - 지난 문서:
              - archive/index.md
              - 스카이본 드루이드 1~20: archive/druid-skyborne-1-20.md
              - 드루이드 솔로·매크로: archive/druid-solo-macros.md
              - 드루이드 던전: archive/druid-dungeon.md
              - 나이트엘프 드루이드 1~20: archive/druid-nightelf-1-20.md
      - 주술사:
          - 고양 · 오크 (호드): classes/shaman-orc.md
          - 고양 · 드워프 (얼라이언스): classes/shaman.md
      - 흑마법사:
          - 고통 · 언데드 (호드): classes/warlock-undead.md
          - 고통 · 노움 (얼라이언스): classes/warlock.md
      - 사제:
          - 암흑 · 언데드 (호드): classes/priest-undead.md
          - 암흑 · 노움 (얼라이언스): classes/priest.md
      - 마법사:
          - 냉기 · 노움 (얼라이언스): classes/mage.md
      - 전사:
          - 방어 · 드워프 (얼라이언스): classes/warrior.md
  - 레벨링:
      - leveling/index.md
      - 호드:
          - 빠른 레벨링 12~30: leveling/fast-route-horde.md
          - 필드 퀘스트 1~30: leveling/field-route-horde.md
      - 얼라이언스:
          - 시작 지역 1~20: tools/alliance-leveling.html
          - 빠른 레벨링 14~27: leveling/fast-route-14-27.md
          - 필드 퀘스트 1~30: leveling/field-route-alliance.md
  - 던전·퀘스트:
      - dungeons/index.md
      - 호드:
          - 통곡의 동굴 사전 퀘스트: leveling/wailing-caverns-horde.md
          - 아늑한 침낭 + 죽음의 폐광: leveling/sleeping-bag-deadmines-horde.md
  - 전문기술:
      - professions/index.md
      - 가죽세공 돈벌이·상인의 호의: professions/leatherworking.md
      - 약초채집 지도: tools/herb-atlas.html
  - 설정·UI:
      - settings/index.md
      - 공통 단축키 규칙: settings/keybinds.md
      - 매크로 교본: tools/macro-guide.html
      - 4K 120프레임 그래픽: settings/graphics.md
  - 업데이트 기록: changelog.md

validation:
  anchors: warn
